[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callin"
version = "0.1.2"
description = "Give your AI agent a real phone line: Callin.io voice agents, calls and transcripts for Python, LangChain and CrewAI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Callin.io", email = "hello@callin.io" }]
keywords = ["ai agents", "phone calls", "voice ai", "telephony", "langchain", "crewai", "mcp", "callin"]
dependencies = ["httpx>=0.24"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Communications :: Telephony"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=0.80"]

[project.urls]
Homepage = "https://callin.io"
Documentation = "https://support.callin.io/api-reference/introduction"
Source = "https://github.com/callin-io/callin-agents"

[tool.hatch.build.targets.wheel]
packages = ["src/callin"]
