name: Publish langchain-callin to PyPI
on:
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing, no API token
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build && python -m build python-langchain
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python-langchain/dist }
