name: Publish callin-sdk to npm (staged, needs approval)
on:
  workflow_dispatch:
jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # trusted publishing (OIDC), no npm token
      contents: read
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # staged publishing needs npm 11.15.0 or later
      - run: npm --version
      - run: npm test
      # The trusted publisher may only stage: a maintainer approves the version on
      # npmjs.com (package > Staged Packages > Approve, with 2FA) before it goes live.
      - run: npm stage publish --access public
