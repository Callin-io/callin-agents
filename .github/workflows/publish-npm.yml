name: Publish callin-sdk to npm
on:
  workflow_dispatch:
jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # trusted publishing (OIDC), no npm token
      contents: read
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1 or later
      - run: npm test
      - run: npm publish --access public --provenance
